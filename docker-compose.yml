# 本地一键起全平台：docker compose up --build
# 构建上下文指向同工作区的兄弟仓，所以必须在 rcp-ops 目录下执行。
name: risk-control

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: risk_control
      MYSQL_USER: risk_app
      MYSQL_PASSWORD: risk_app_pwd
      MYSQL_ROOT_PASSWORD: root_pwd
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pwd"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 注册/配置中心。应用侧已引入 nacos-discovery 依赖，按服务名注册与解析
  # （server-addr/namespace/group 的占位符默认值即命中本文件：服务名 nacos，
  # namespace risk-control）。接线过程见 rcp-contracts/docs/DISCOVERY.md。
  # 未加 healthcheck 是因为镜像内是否带 curl 随版本变化，不写无法验证的探针。
  nacos:
    image: nacos/nacos-server:v2.3.2
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"

  # 一次性初始化：创建 risk-control 命名空间。Nacos 的 namespace 不随注册自动创建，
  # 应用往不存在的 namespace 注册会失败，故所有 Java 服务启动前先经 console API 建好。
  nacos-init:
    image: curlimages/curl:8.10.1
    depends_on: [nacos]
    entrypoint:
      - /bin/sh
      - -c
      - |
        until curl -sf -o /dev/null http://nacos:8848/nacos/v1/console/health/readiness; do
          echo "waiting for nacos..." && sleep 2
        done
        # 幂等：已存在时 Nacos 返回错误信息，忽略即可
        curl -s -X POST "http://nacos:8848/nacos/v1/console/namespaces" \
          -d "customNamespaceId=risk-control&namespaceName=risk-control" || true
        echo "namespace risk-control ready"

  api-gateway:
    build: ../rcp-api-gateway
    depends_on:
      nacos-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: "8080"
      PATROL_ROUTES_ENDPOINTS_CONTENT: http://content-patrol:8081
      PATROL_ROUTES_ENDPOINTS_MESSAGE: http://message-patrol:8082
      PATROL_ROUTES_ENDPOINTS_ACCOUNT: http://account-patrol:8083
      PATROL_ROUTES_ENDPOINTS_FUND: http://fund-patrol:8084
    ports:
      - "8080:8080"
    depends_on: [content-patrol, message-patrol, account-patrol, fund-patrol]

  content-patrol:
    build: ../rcp-content-patrol
    depends_on:
      nacos-init:
        condition: service_completed_successfully
    ports: ["8081:8081"]

  message-patrol:
    build: ../rcp-message-patrol
    depends_on:
      nacos-init:
        condition: service_completed_successfully
    ports: ["8082:8082"]

  account-patrol:
    build: ../rcp-account-patrol
    depends_on:
      nacos-init:
        condition: service_completed_successfully
    ports: ["8083:8083"]

  fund-patrol:
    build: ../rcp-fund-patrol
    depends_on:
      nacos-init:
        condition: service_completed_successfully
    ports: ["8084:8084"]

  dataway:
    build: ../rcp-dataway
    depends_on:
      nacos-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/risk_control?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: risk_app
      SPRING_DATASOURCE_PASSWORD: risk_app_pwd
    ports: ["8090:8090"]
    depends_on:
      mysql:
        condition: service_healthy

  db-ops:
    build: ../rcp-db-ops
    depends_on:
      nacos-init:
        condition: service_completed_successfully
    environment:
      DBOPS_MIGRATIONS_DIR: /app/migrations
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/risk_control?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: risk_app
      SPRING_DATASOURCE_PASSWORD: risk_app_pwd
    volumes:
      - ./migrations:/app/migrations:ro
    ports: ["8091:8091"]
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ../rcp-web
    ports: ["5173:8080"]
    depends_on: [api-gateway]

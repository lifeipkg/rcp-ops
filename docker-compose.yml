# 本地一键起全平台：docker compose up --build
# 构建上下文指向同工作区的兄弟仓，所以必须在 rcp-ops 目录下执行。
#
# 凭据不入库：口令从同目录的 .env 读取（见 .env.example）。缺变量时 compose 直接报错，
# 不会静默使用弱口令。真实集群同样不提交明文，见 k8s/02-secret.example.yaml 的说明。
name: risk-control

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: risk_control
      POSTGRES_USER: risk_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 rcp-ops/.env 里设置 DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk_app -d risk_control"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ../rcp-api-gateway
    depends_on:
      iam:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      # 只注入服务名，不写完整地址（RL-007）。
      IAM_HOST: iam
    ports:
      - "8080:8080"

  # 身份与访问管理：网关逐请求内省判定令牌，登录/用户管理经网关透传。
  # 引导口令从 .env 读；真实部署改为 Secret 注入（见 k8s/02-secret.example.yaml）。
  iam:
    build: ../rcp-iam
    depends_on:
      dataway:
        condition: service_started
    environment:
      SERVER_PORT: "8085"
      DATAWAY_HOST: dataway
      DATAWAY_PORT: "8090"
      DATAWAY_DATASOURCE: main
      IAM_ADMIN_PASSWORD: ${IAM_ADMIN_PASSWORD:?请在 rcp-ops/.env 里设置 IAM_ADMIN_PASSWORD}
      IAM_OPERATOR_PASSWORD: ${IAM_OPERATOR_PASSWORD:?请在 rcp-ops/.env 里设置 IAM_OPERATOR_PASSWORD}
      IAM_VIEWER_PASSWORD: ${IAM_VIEWER_PASSWORD:?请在 rcp-ops/.env 里设置 IAM_VIEWER_PASSWORD}
    ports: ["8085:8085"]

  # 数据网关：按 Service 名经 DNS 解析，连接串走单一变量。
  dataway:
    build: ../rcp-dataway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATAWAY_DB_DSN: "postgres://risk_app:${DB_PASSWORD}@postgres:5432/risk_control?sslmode=disable"
    ports: ["8090:8090"]

  # 迁移执行器：迁移目录只读挂载，DDL 只能经它执行（RL-004）。
  db-ops:
    build: ../rcp-db-ops
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DBOPS_MIGRATIONS_DIR: /app/migrations
      DBOPS_DB_DSN: "postgres://risk_app:${DB_PASSWORD}@postgres:5432/risk_control?sslmode=disable"
    volumes:
      - ./migrations:/app/migrations:ro
    ports: ["8091:8091"]

  web:
    build: ../rcp-web
    ports: ["5173:8080"]
    depends_on: [api-gateway]

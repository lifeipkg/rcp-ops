apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-patrol
  namespace: risk-control
  labels:
    app: content-patrol
    platform: risk-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: content-patrol
  template:
    metadata:
      labels:
        app: content-patrol
        platform: risk-control
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: content-patrol
          image: ghcr.io/lifeipkg/rcp-content-patrol:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SERVER_PORT
              value: "8081"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: content-patrol
  namespace: risk-control
  labels:
    app: content-patrol
spec:
  type: ClusterIP
  selector:
    app: content-patrol
  ports:
    - name: http
      port: 8081
      targetPort: http

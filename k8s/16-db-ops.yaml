apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-ops
  namespace: risk-control
  labels:
    app: db-ops
    platform: risk-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-ops
  template:
    metadata:
      labels:
        app: db-ops
        platform: risk-control
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001   # 与 rcp-db-ops/Dockerfile 的 app 用户一致
      containers:
        - name: db-ops
          image: ghcr.io/lifeipkg/rcp-db-ops:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
              name: http
          env:
            - name: SERVER_PORT
              value: "8091"
            - name: DBOPS_MIGRATIONS_DIR
              value: /app/migrations
            # 按 Service 名经 k8s DNS 解析；连接串按分量拼装
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: risk_control
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rcp-db-credential
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rcp-db-credential
                  key: password
          volumeMounts:
            - name: migrations
              mountPath: /app/migrations
              readOnly: true
          # Go 版只有单一探活（与 rcp-iam 一致）
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: migrations
          configMap:
            name: db-migrations
---
apiVersion: v1
kind: Service
metadata:
  name: db-ops
  namespace: risk-control
  labels:
    app: db-ops
spec:
  type: ClusterIP
  selector:
    app: db-ops
  ports:
    - name: http
      port: 8091
      targetPort: http

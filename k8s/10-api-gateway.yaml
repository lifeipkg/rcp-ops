apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: risk-control
  labels:
    app: api-gateway
    platform: risk-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        platform: risk-control
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api-gateway
          image: ghcr.io/lifeipkg/rcp-api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_PORT
              value: "8080"
            # 上游地址：注册中心未接入期间由环境变量给出（RL-007 例外已登记）。
            # 接入 Nacos 后改由 spring.cloud.nacos.discovery 按服务名解析，这四条随之删除。
            - name: PATROL_ROUTES_ENDPOINTS_CONTENT
              value: http://content-patrol:8081
            - name: PATROL_ROUTES_ENDPOINTS_MESSAGE
              value: http://message-patrol:8082
            - name: PATROL_ROUTES_ENDPOINTS_ACCOUNT
              value: http://account-patrol:8083
            - name: PATROL_ROUTES_ENDPOINTS_FUND
              value: http://fund-patrol:8084
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: risk-control
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http

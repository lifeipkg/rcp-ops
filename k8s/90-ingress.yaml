apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: risk-control
  namespace: risk-control
  annotations:
    # 边缘只暴露两件事：前端页面与 /api 网关入口（红线 RL-002）
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  rules:
    - host: risk-control.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80

# 示例凭据：真实集群请用 ExternalSecrets / SealedSecrets 注入，不要提交真实密码。
apiVersion: v1
kind: Secret
metadata:
  name: rcp-db-credential
  namespace: risk-control
type: Opaque
stringData:
  username: risk_app
  password: change-me-in-cluster
---
# 唯一 IAM 的引导账号（17-iam.yaml 引用，optional: true）。
# 仅首次启动时用于创建账号；账号已存在时不会覆盖（改口令走 API）。
apiVersion: v1
kind: Secret
metadata:
  name: rcp-iam-bootstrap
  namespace: risk-control
type: Opaque
stringData:
  admin-password: change-me-admin
  operator-password: change-me-operator
  viewer-password: change-me-viewer

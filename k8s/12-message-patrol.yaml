apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-patrol
  namespace: risk-control
  labels:
    app: message-patrol
    platform: risk-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: message-patrol
  template:
    metadata:
      labels:
        app: message-patrol
        platform: risk-control
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: message-patrol
          image: ghcr.io/lifeipkg/rcp-message-patrol:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SERVER_PORT
              value: "8082"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: message-patrol
  namespace: risk-control
  labels:
    app: message-patrol
spec:
  type: ClusterIP
  selector:
    app: message-patrol
  ports:
    - name: http
      port: 8082
      targetPort: http

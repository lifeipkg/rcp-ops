apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataway
  namespace: risk-control
  labels:
    app: dataway
    platform: risk-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataway
  template:
    metadata:
      labels:
        app: dataway
        platform: risk-control
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001   # 与 rcp-dataway/Dockerfile 的 app 用户一致
      containers:
        - name: dataway
          image: ghcr.io/lifeipkg/rcp-dataway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: SERVER_PORT
              value: "8090"
            # 按 Service 名经 k8s DNS 解析，清单里不写上游 URL（RL-007）。
            # 连接串按分量拼装，复用既有的 rcp-db-credential（username / password）。
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: risk_control
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rcp-db-credential
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rcp-db-credential
                  key: password
          # Go 版只有单一探活（与 rcp-iam 一致）：没有 Java Actuator 的 /readiness /liveness 子路径
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: dataway
  namespace: risk-control
  labels:
    app: dataway
spec:
  type: ClusterIP
  selector:
    app: dataway
  ports:
    - name: http
      port: 8090
      targetPort: http
